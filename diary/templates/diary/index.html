<!doctype html>
<html>
  <head>
    <title>Write - Smart Diary AI</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        height: 100vh;
        /* This adds a beautiful, calming forest background */
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
          url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        max-width: 600px;
        width: 90%;
        background: rgba(255, 255, 255, 0.95); /* Semi-transparent white */
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(5px); /* Frosty glass effect */
      }
      /* ... keep your other styles (h1, textarea, button) here ... */
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Smart Diary AI</h1>
      <p class="welcome-msg">
        Welcome, <strong>{{ user.username }}</strong>! How was your day?
      </p>

      <form method="POST">
        {% csrf_token %}
        <textarea name="content" placeholder="Type your thoughts here...">
{{ text }}</textarea
        >
        <button type="submit">Save & Analyze Entry</button>
      </form>

      {% if mood %}
      <div class="result-box">
        <h3>Detected Mood: {{ mood }}</h3>
        <p>Your entry has been saved to your library.</p>
      </div>
      {% endif %}

      <div class="nav-links">
        <a
          href="{% url 'history' %}"
          style="text-decoration: none; color: #1a73e8; font-weight: bold"
          >📅 View My History & Calendar</a
        >
        <a
          href="{% url 'logout' %}"
          style="text-decoration: none; color: #d93025"
          >Logout</a
        >
      </div>
    </div>
  </body>
</html>
