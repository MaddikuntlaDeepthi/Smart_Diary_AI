<!doctype html>
<html>
  <head>
    <title>Reset Password - Smart Diary</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        height: 100vh;
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url("https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .reset-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        backdrop-filter: blur(10px);
        text-align: center;
      }
      h2 {
        color: #d93025;
        margin-bottom: 10px;
      }
      p.instruction {
        color: #666;
        margin-bottom: 20px;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        background: #d93025;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 15px;
      }
      .error {
        color: #d93025;
        font-size: 14px;
        margin-top: 10px;
      }
      .footer {
        margin-top: 20px;
      }
      a {
        color: #1a73e8;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="reset-card">
      <h2>Forgot Password?</h2>
      <p class="instruction">
        Enter your details and answer your security question to set a new
        password.
      </p>

      <form method="POST">
        {% csrf_token %}
        <input
          type="text"
          name="username"
          placeholder="Your Username"
          required
        />
        <p
          style="
            text-align: left;
            font-weight: bold;
            font-size: 13px;
            margin: 10px 0 0 5px;
          "
        >
          Security Question: What is your favorite color?
        </p>
        <input type="text" name="answer" placeholder="Your Answer" required />
        <input
          type="password"
          name="new_password"
          placeholder="Enter New Password"
          required
        />
        <button type="submit">Reset My Password</button>
      </form>

      {% if message %}
      <p class="error">{{ message }}</p>
      {% endif %}

      <div class="footer">
        <a href="{% url 'login' %}">Wait, I remember it! Login</a>
      </div>
    </div>
  </body>
</html>
