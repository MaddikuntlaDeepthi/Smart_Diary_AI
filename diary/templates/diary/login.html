<!doctype html>
<html>
  <head>
    <title>Login - Smart Diary AI</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        height: 100vh;
        /* Soft, ethereal mountain background */
        background:
          linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
          url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-card {
        background: rgba(255, 255, 255, 0.9); /* Semi-transparent */
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        backdrop-filter: blur(10px); /* Blurs the background behind the card */
        text-align: center;
      }
      h2 {
        color: #1a73e8;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        background: #1a73e8;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
        transition: 0.3s;
      }
      button:hover {
        background: #1557b0;
      }
      .footer {
        margin-top: 20px;
        font-size: 14px;
      }
      a {
        color: #1a73e8;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Welcome Back</h2>
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
      <div class="footer">
        Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
      </div>
      <div style="margin-top: 10px">
        <a
          href="{% url 'reset_password' %}"
          style="font-size: 13px; color: #666"
          >Forgot Password?</a
        >
      </div>
    </div>
  </body>
</html>
